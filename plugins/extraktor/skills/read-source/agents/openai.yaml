interface:
  display_name: "Read and verify a web source"
  short_description: "Read a web page and check its evidence"
  default_prompt: "Use $read-source to read this page and answer from its evidence."
dependencies:
  tools:
    - type: "mcp"
      value: "extraktor"
      description: "Read and search public web sources with Extraktor"
      transport: "streamable_http"
      url: "https://extraktor.app/mcp"
policy:
  allow_implicit_invocation: false
